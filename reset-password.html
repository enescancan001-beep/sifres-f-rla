<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şifre Sıfırlama - Diksiyon & Hitabet</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0A0E14; color: #F5F6FA; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #131826; border: 1px solid #1E2536; padding: 36px 28px; border-radius: 24px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
    .badge { display: inline-block; background-color: rgba(108, 99, 255, 0.16); padding: 8px 16px; border-radius: 100px; color: #6C63FF; font-weight: 700; font-size: 13px; margin-bottom: 20px; border: 1px solid rgba(108, 99, 255, 0.35); }
    h2 { font-size: 22px; margin-bottom: 8px; color: #fff; font-weight: 800; }
    p { color: #8B93A7; font-size: 14px; margin-bottom: 24px; line-height: 1.5; }
    
    .input-group { text-align: left; margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: #8B93A7; margin-bottom: 6px; font-weight: 600; }
    input { width: 100%; padding: 14px; background: #0A0E14; border: 1px solid #1E2536; border-radius: 12px; color: #fff; font-size: 15px; outline: none; transition: all 0.2s; }
    input:focus { border-color: #6C63FF; box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.2); }
    
    button { width: 100%; padding: 15px; background: #6C63FF; color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; transition: background 0.2s; }
    button:hover { background: #5b52e0; }
    button:disabled { background: #2a2d3d; color: #636b7b; cursor: not-allowed; }
    
    .alert { padding: 12px 16px; border-radius: 10px; font-size: 13px; margin-bottom: 16px; text-align: left; display: none; line-height: 1.4; }
    .alert-error { background: rgba(255, 77, 77, 0.12); color: #ff6b6b; border: 1px solid rgba(255, 77, 77, 0.3); }
    
    .state-screen { display: none; }
    .active { display: block; }
    .icon { font-size: 56px; margin-bottom: 16px; display: inline-block; }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">🎙️ DİKSİYON & HİTABET</div>

    <!-- 1. FORM EKRANI (Doğrudan Açılır) -->
    <div id="form-state" class="state-screen active">
      <h2>Yeni Şifre Belirleyin</h2>
      <p>Hesabınız için yeni şifrenizi girin.</p>

      <div id="error-box" class="alert alert-error"></div>

      <form id="reset-form">
        <div class="input-group">
          <label>Yeni Şifre</label>
          <input type="password" id="password" required minlength="6" placeholder="En az 6 karakter">
        </div>
        <div class="input-group">
          <label>Yeni Şifre (Tekrar)</label>
          <input type="password" id="confirm-password" required minlength="6" placeholder="Şifrenizi tekrar girin">
        </div>
        <button type="submit" id="submit-btn">Şifreyi Güncelle</button>
      </form>
    </div>

    <!-- 2. BAŞARI EKRANI (Güncelleme Sonrası Açılır) -->
    <div id="success-state" class="state-screen">
      <div class="icon">🎉</div>
      <h2>Şifreniz Başarıyla Sıfırlandı!</h2>
      <p>Hesap şifreniz güvenli bir şekilde güncellendi. Artık bu sayfayı kapatabilir ve mobil uygulamadan yeni şifrenizle giriş yapabilirsiniz.</p>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://tzbvnvmxkzazhfiyqeyo.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_l53MN6fRHWk3BV90KWf_9A_LvblttjB";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const formState = document.getElementById('form-state');
    const successState = document.getElementById('success-state');
    const errorBox = document.getElementById('error-box');

    document.getElementById('reset-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const password = document.getElementById('password').value.trim();
      const confirmPassword = document.getElementById('confirm-password').value.trim();
      const submitBtn = document.getElementById('submit-btn');

      errorBox.style.display = 'none';

      // 1. Şifre Uzunluk Kontrolü
      if (password.length < 6) {
        showError("Şifreniz en az 6 karakterden oluşmalıdır.");
        return;
      }

      // 2. Eşleşme Kontrolü
      if (password !== confirmPassword) {
        showError("Girdiğiniz şifreler birbiriyle eşleşmiyor! Lütfen iki alana da aynı şifreyi girin.");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "Şifreniz Sıfırlanıyor...";

      try {
        // 3. Supabase Şifre Güncelleme
        const { data, error } = await supabase.auth.updateUser({
          password: password
        });

        if (error) {
          const isSessionErr = error.message.toLowerCase().includes("session") || error.message.toLowerCase().includes("auth");
          showError(isSessionErr ? "Şifre sıfırlama bağlantısının süresi dolmuş veya geçersiz. Lütfen mobil uygulamadan yeni bir istek gönderin." : "Hata: " + error.message);
          submitBtn.disabled = false;
          submitBtn.innerText = "Şifreyi Güncelle";
        } else {
          await supabase.auth.signOut();
          formState.classList.remove('active');
          successState.classList.add('active');
        }
      } catch (err) {
        showError("Sistemde bir sorun oluştu. Lütfen tekrar deneyin.");
        submitBtn.disabled = false;
        submitBtn.innerText = "Şifreyi Güncelle";
      }
    });

    function showError(text) {
      errorBox.innerText = text;
      errorBox.style.display = 'block';
    }
  </script>
</body>
</html>
