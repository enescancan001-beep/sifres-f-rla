<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şifre Sıfırlama - Diksiyon & Hitabet</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0A0E14; color: #F5F6FA; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #131826; border: 1px solid #1E2536; padding: 32px; border-radius: 20px; width: 100%; max-width: 420px; text-align: center; }
    .badge { display: inline-block; background-color: rgba(108, 99, 255, 0.16); padding: 8px 16px; border-radius: 100px; color: #6C63FF; font-weight: 700; font-size: 13px; margin-bottom: 20px; border: 1px solid rgba(108, 99, 255, 0.35); }
    h2 { font-size: 22px; margin-bottom: 8px; color: #fff; }
    p { color: #8B93A7; font-size: 14px; margin-bottom: 24px; }
    .input-group { text-align: left; margin-bottom: 16px; }
    label { display: block; font-size: 13px; color: #8B93A7; margin-bottom: 6px; }
    input { width: 100%; padding: 12px; background: #0A0E14; border: 1px solid #1E2536; border-radius: 10px; color: #fff; font-size: 15px; outline: none; }
    input:focus { border-color: #6C63FF; }
    button { width: 100%; padding: 14px; background: #6C63FF; color: white; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 10px; }
    button:disabled { background: #3a3b5c; opacity: 0.6; cursor: not-allowed; }
    .message { margin-top: 16px; padding: 12px; border-radius: 8px; font-size: 14px; display: none; }
    .error { background: rgba(255, 77, 77, 0.15); color: #ff4d4d; border: 1px solid rgba(255, 77, 77, 0.3); display: block; }
    .success { background: rgba(85, 239, 196, 0.15); color: #00b894; border: 1px solid rgba(85, 239, 196, 0.3); display: block; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🎙️ DİKSİYON & HİTABET</div>
    <h2>Yeni Şifre Belirleyin</h2>
    <p>Hesabınız için yeni bir şifre girin.</p>

    <form id="reset-form">
      <div class="input-group">
        <label>Yeni Şifre</label>
        <input type="password" id="password" required minlength="6" placeholder="En az 6 karakter">
      </div>
      <div class="input-group">
        <label>Yeni Şifre (Tekrar)</label>
        <input type="password" id="confirm-password" required minlength="6" placeholder="Şifrenizi tekrar girin">
      </div>
      <button type="submit" id="submit-btn">Şifreyi Güncelle</button>
    </form>

    <div id="status-msg" class="message"></div>
  </div>

  <script>
    const SUPABASE_URL = "https://tzbvnvmxkzazhfiyqeyo.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_l53MN6fRHWk3BV90KWf_9A_LvblttjB";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('reset-form');
    const submitBtn = document.getElementById('submit-btn');
    const statusMsg = document.getElementById('status-msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const p1 = document.getElementById('password').value;
      const p2 = document.getElementById('confirm-password').value;

      if (p1 !== p2) {
        showMsg("Şifreler birbiriyle eşleşmiyor!", "error");
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = "Güncelleniyor...";

      const { error } = await supabase.auth.updateUser({ password: p1 });

      if (error) {
        showMsg("Hata: " + error.message, "error");
        submitBtn.disabled = false;
        submitBtn.innerText = "Şifreyi Güncelle";
      } else {
        showMsg("Şifreniz başarıyla güncellendi! Mobil uygulamadan yeni şifrenizle giriş yapabilirsiniz.", "success");
        form.reset();
        submitBtn.style.display = 'none';
      }
    });

    function showMsg(text, type) {
      statusMsg.innerText = text;
      statusMsg.className = "message " + type;
    }
  </script>
</body>
</html>
