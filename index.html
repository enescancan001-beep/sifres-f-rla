<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diksiyon & Hitabet - Hesap Doğrulandı</title>

  <script>
    (function() {
      var hash = window.location.hash || '';
      var search = window.location.search || '';
      if (hash.includes('type=recovery') || search.includes('type=recovery') || search.includes('code=')) {
        window.location.replace('/reset-password.html' + search + hash);
      }
    })();
  </script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: #0A0E14; color: #F5F6FA; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; text-align: center; }
    .card { background-color: #131826; border: 1px solid #1E2536; border-radius: 24px; padding: 40px 24px; max-width: 420px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .badge { display: inline-block; background: rgba(45, 212, 191, 0.12); color: #2DD4BF; border: 1px solid rgba(45, 212, 191, 0.3); padding: 8px 16px; border-radius: 100px; font-size: 13px; font-weight: 700; margin-bottom: 20px; }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 12px; color: #FFFFFF; }
    p { font-size: 14px; color: #8B93A7; line-height: 22px; margin-bottom: 28px; }
    .footer { font-size: 12px; color: #525C70; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🎙️ DİKSİYON & HİTABET</div>
    <h1>Hesabınız Başarıyla Doğrulandı! 🎉</h1>
    <p>E-posta adresiniz onaylandı. Artık uygulamaya geri dönüp şifrenizle giriş yapabilir ve pratiklerinize başlayabilirsiniz.</p>
    <div class="footer">Diksiyon Pratiği Mobil Uygulaması • Özbek Interactive</div>
  </div>
</body>
</html>
