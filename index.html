<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Şifre Sıfırlama - Diksiyon & Hitabet</title>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f5f6fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #ffffff; padding: 32px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; }
    h2 { color: #2d3436; margin-bottom: 8px; font-size: 22px; }
    p { color: #636e72; font-size: 14px; margin-bottom: 24px; }
    .input-group { text-align: left; margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #2d3436; margin-bottom: 6px; }
    input { width: 100%; padding: 12px; border: 1px solid #dfe6e9; border-radius: 8px; font-size: 15px; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: #6c5ce7; }
    button { width: 100%; padding: 14px; background-color: #6c5ce7; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
    button:hover { background-color: #5b4cc4; }
    button:disabled { background-color: #b2bec3; cursor: not-allowed; }
    .message { margin-top: 16px; font-size: 14px; padding: 10px; border-radius: 6px; display: none; }
    .error { background-color: #ffeaa7; color: #d63031; display: block; }
    .success { background-color: #55efc4; color: #006266; display: block; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Yeni Şifre Belirle</h2>
    <p>Diksiyon & Hitabet hesabınız için lütfen yeni bir şifre girin.</p>

    <form id="reset-form">
      <div class="input-group">
        <label for="password">Yeni Şifre</label>
        <input type="password" id="password" placeholder="En az 6 karakter" required minlength="6">
      </div>
      <div class="input-group">
        <label for="confirm-password">Yeni Şifre (Tekrar)</label>
        <input type="password" id="confirm-password" placeholder="Şifrenizi tekrar girin" required minlength="6">
      </div>
      <button type="submit" id="submit-btn">Şifreyi Güncelle</button>
    </form>

    <div id="status-message" class="message"></div>
  </div>

  <script>
   // index.html içerisindeki Supabase bağlantı alanı:
const SUPABASE_URL = "https://tzbvnvmxkzazhfiyqeyo.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_l53MN6fRHWk3BV90KWf_9A_LvblttjB";

const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const form = document.getElementById('reset-form');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirm-password');
    const submitBtn = document.getElementById('submit-btn');
    const statusMsg = document.getElementById('status-message');

    // 2. FORM GÖNDERME İŞLEMİ
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (password !== confirmPassword) {
        showMessage('Şifreler birbiriyle eşleşmiyor.', 'error');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'Güncelleniyor...';
      statusMsg.style.display = 'none';

      try {
        // SUPABASE ÜZERİNDE ŞİFREYİ GÜNCELLEYEN ASIL METOT
        const { data, error } = await supabase.auth.updateUser({
          password: password
        });

        if (error) {
          showMessage('Hata: ' + error.message, 'error');
          submitBtn.disabled = false;
          submitBtn.innerText = 'Şifreyi Güncelle';
        } else {
          showMessage('Şifreniz başarıyla güncellendi! Artık mobil uygulamadan yeni şifrenizle giriş yapabilirsiniz.', 'success');
          form.reset();
          submitBtn.style.display = 'none';
        }
      } catch (err) {
        showMessage('Bir sistem hatası oluştu.', 'error');
        submitBtn.disabled = false;
        submitBtn.innerText = 'Şifreyi Güncelle';
      }
    });

    function showMessage(text, type) {
      statusMsg.innerText = text;
      statusMsg.className = 'message ' + type;
    }
  </script>
</body>
</html>
