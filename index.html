<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diksiyon & Hitabet - Onay</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0A0E14; color: #F5F6FA; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; text-align: center; }
    .card { background: #131826; border: 1px solid #1E2536; padding: 40px 28px; border-radius: 24px; width: 100%; max-width: 420px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
    .badge { display: inline-block; background: rgba(108, 99, 255, 0.15); color: #6C63FF; border: 1px solid rgba(108, 99, 255, 0.3); padding: 8px 18px; border-radius: 100px; font-size: 13px; font-weight: 700; margin-bottom: 24px; }
    .icon { font-size: 60px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 800; color: #fff; margin-bottom: 12px; }
    p { font-size: 14.5px; color: #8B93A7; line-height: 1.6; margin-bottom: 24px; }
    .btn { display: inline-block; background: #4F46E5; color: #ffffff; text-decoration: none; padding: 14px 28px; border-radius: 12px; font-weight: 700; font-size: 15px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🎙️ DİKSİYON & HİTABET</div>
    <div class="icon">🔒</div>
    <h1>Kimliğiniz Doğrulandı!</h1>
    <p>E-posta adresinin size ait olduğu onaylandı. Şifrenizi sıfırlamak için uygulamaya yönlendiriliyorsunuz...</p>
    <a id="open-app-btn" href="#" class="btn" style="display: none;">Uygulamayı Aç</a>
  </div>

  <script>
    // URL'deki tüm doğrulama jetonlarını (tokens/hash) al
    const hash = window.location.hash || window.location.search;
    
    // Expo / React Native Deep Link Şeması
    const appDeepLink = "diksiyonpro://" + hash;

    const btn = document.getElementById('open-app-btn');
    btn.href = appDeepLink;
    btn.style.display = "inline-block";

    // Uygulamayı otomatik açmayı dene
    window.location.href = appDeepLink;
  </script>
</body>
</html>
